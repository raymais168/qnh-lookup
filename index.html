<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QNH Lookup Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
    }
    .reset-btn {
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
    }
    .reset-btn:hover { background: #e2e8f0; color: #0f172a; }
    .box {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .box.result-box {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    label, .lbl {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
    }
    input[type="text"] {
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      background: #ffffff;
      color: #0f172a;
    }
    input[type="text"]:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }
    .action-btn {
      padding: 11px 16px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: #ffffff;
      cursor: pointer;
    }
    .action-btn:hover { background: #115e59; }
    .result-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1d4ed8;
      min-height: 36px;
      display: flex;
      align-items: center;
    }
    .err { color: #b91c1c; font-size: 1rem; }
  </style>

  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Offline QNH lookup calculator using the supplied pressure lookup table." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

</head>
<body>
  <div class="card">
    <div class="header-bar">
      <span class="header-title">QNH Lookup Calculator</span>
      <button type="button" class="reset-btn" id="resetBtn" title="Clear input and result">Reset</button>
    </div>

    <div class="box">
      <label for="stationPressure">Station Level Pressure (hPa)</label>
      <input
        type="text"
        id="stationPressure"
        inputmode="decimal"
        autocomplete="off"
        spellcheck="false"
        placeholder="e.g. 1005.6"
      />
    </div>

    <button type="button" class="action-btn" id="lookupBtn">QNH Look up</button>

    <div class="box result-box">
      <span class="lbl">QNH (hPa)</span>
      <div class="result-val" id="qnhResult">—</div>
    </div>
  </div>

  <script>
    // Table C values transcribed directly from the supplied Excel workbook.

    function sanitizeInput() {
      const input = document.getElementById("stationPressure");
      const cleaned = input.value.replace(/[^0-9.]/g, "");
      if (input.value !== cleaned) input.value = cleaned;
    }

    function lookupQNH() {
      const input = document.getElementById("stationPressure");
      const result = document.getElementById("qnhResult");

      sanitizeInput();
      const rawValue = input.value.trim();

      if (rawValue === "" || rawValue === ".") {
        result.textContent = "Enter station level pressure";
        result.className = "result-val err";
        return;
      }

      const pressure = Number(rawValue);

      if (!Number.isFinite(pressure)) {
        result.textContent = "Invalid pressure reading";
        result.className = "result-val err";
        return;
      }

      const match = QNH_TABLE.find(row =>
        pressure >= row.min - 1e-9 && pressure <= row.max + 1e-9
      );

      if (!match) {
        const minPressure = QNH_TABLE[0].min.toFixed(1);
        const maxPressure = QNH_TABLE[QNH_TABLE.length - 1].max.toFixed(1);
        result.textContent = `No matching entry (${minPressure}–${maxPressure} hPa)`;
        result.className = "result-val err";
        return;
      }

      result.textContent = `${match.qnh} hPa`;
      result.className = "result-val";
    }

    function resetAll() {
      document.getElementById("stationPressure").value = "";
      const result = document.getElementById("qnhResult");
      result.textContent = "—";
      result.className = "result-val";
      document.getElementById("stationPressure").focus();
    }

    const pressureInput = document.getElementById("stationPressure");

    pressureInput.addEventListener("input", sanitizeInput);
    pressureInput.addEventListener("keydown", event => {
      if (event.key === "Enter") lookupQNH();
    });

    document.getElementById("lookupBtn").addEventListener("click", lookupQNH);
    document.getElementById("resetBtn").addEventListener("click", resetAll);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service worker registration failed:", error));
      });
    }
  </script>

</body>
</html>
